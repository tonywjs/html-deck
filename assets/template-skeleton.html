@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
:root{
  --ink:#0f172a; --sub:#64748b; --line:#e6eaf0; --accent:#2563eb;
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;}
.slide{font-family:var(--font);}
.fig-elabel{font-size:14px;}                 /* 화살표 라벨 하한(엔진 기본 12px 오버라이드) */
/* 슬라이드 안 도형·텍스트 스타일은 자유롭게 추가 */
</style>
<style id="fig-editor-css">
/*__FIG_EDITOR_CSS__*/
</style>

/*__DECK_CSS__*/
